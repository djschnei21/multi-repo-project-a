<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo · multi-repo demo</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="card">
      <header>
        <h1>Todos</h1>
        <span id="api-status" class="pill">checking API…</span>
      </header>

      <form id="new-todo">
        <input id="title" name="title" placeholder="What needs doing?" autocomplete="off" required />
        <button type="submit">Add</button>
      </form>

      <p id="error" class="error" hidden></p>
      <ul id="todos"></ul>
      <footer id="summary"></footer>
    </main>

    <p class="caption">
      Frontend: <code>multi-repo-project-a</code> · Backend: <code>multi-repo-project-b</code>
    </p>

    <script type="module" src="/app.js"></script>
  </body>
</html>
